{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>{{ title }}</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Название товара</label>
                            <input type="text" name="product_name" class="form-control" 
                                   value="{{ product[1] if product else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Бренд (опционально)</label>
                            <input type="text" name="brand" class="form-control"
                                   value="{{ product[2] if product else '' }}">
                            <small class="text-muted">Если не указать — определится автоматически</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Цена (₽)</label>
                            <input type="number" step="0.01" name="price" class="form-control"
                                   value="{{ product[3] if product else '' }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/admin/products" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
