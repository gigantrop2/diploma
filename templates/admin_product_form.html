{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>{{ title }}</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Название товара</label>
                            <input type="text" name="product_name" class="form-control" 
                                   value="{{ product[1] if product else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Бренд (опционально)</label>
                            <input type="text" name="brand" class="form-control"
                                   value="{{ product[2] if product else '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Цена (₽)</label>
                            <input type="number" step="0.01" name="price" class="form-control"
                                   value="{{ product[3] if product else '' }}" required>
                        </div>

                        <!-- Выбор категории -->
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select name="category_id" class="form-select">
                                <option value="">-- Без категории --</option>
                                {% for cat in categories %}
                                <option value="{{ cat[0] }}" {% if product and product[4] == cat[0] %}selected{% endif %}>
                                    {{ cat[1] }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Характеристики (JSON)</label>
                            <textarea name="specifications" class="form-control" rows="5" placeholder='{"Диагональ экрана": "6.7\"", "Встроенная память": "256 ГБ", "Операционная система": "Android 16"}'>{{ product[5] if product else '' }}</textarea>
                            <small class="text-muted">Формат JSON: {"Название": "Значение"}</small>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/admin/products" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
