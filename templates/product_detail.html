{% extends "base.html" %}

{% block title %}{{ product[1] }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 mb-3">{{ product[1] }}</h1>
                <p class="price display-6 fw-bold mb-4">{{ product[2] }} ₽</p>

                <h5 class="mb-3">Наличие в магазинах</h5>
                <div class="list-group mb-4">
                    {% for store in stocks %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ store[1] }}</strong><br>
                            <small class="text-muted">{{ store[2] }}, {{ store[3] }}</small>
                        </div>
                        <div>
                            <span class="badge bg-success">{{ store[6] }} шт.</span>
                            <form action="/add_to_cart" method="post" class="d-inline-block ms-2">
                                <input type="hidden" name="product_id" value="{{ product[0] }}">
                                <input type="hidden" name="store_id" value="{{ store[0] }}">
                                <input type="hidden" name="quantity" value="1">
                                <input type="hidden" name="price" value="{{ product[2] }}">
                                <button class="btn btn-sm btn-primary">В корзину</button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <a href="/products" class="btn btn-outline-secondary">← Назад к товарам</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
