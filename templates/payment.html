{% extends "base.html" %}

{% block title %}Оплата заказа{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Оплата заказа №{{ order_number }}</h3>
            </div>
            <div class="card-body text-center">
                <p class="h4 mb-4">Сумма к оплате: <strong>{{ total_amount }} ₽</strong></p>

                <form method="post" action="/payment/process/{{ order_id }}">
                    <div class="alert alert-info mb-4">
                        🔐 Демо-режим: нажмите «Оплатить» для имитации
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100">Оплатить {{ total_amount }} ₽</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
