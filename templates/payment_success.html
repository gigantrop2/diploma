{% extends "base.html" %}

{% block title %}Оплата успешна{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">✅ Оплата прошла успешно</h3>
            </div>
            <div class="card-body text-center">
                <p>Ваш заказ оплачен и передан в обработку.</p>
                <a href="/order/{{ order_id }}" class="btn btn-primary">Перейти к заказу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
