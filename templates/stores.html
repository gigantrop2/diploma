{% extends "base.html" %}

{% block title %}Все магазины{% endblock %}

{% block content %}
<h1 class="mb-4">Наши магазины</h1>

<div class="row">
    {% for store in stores %}
    <div class="col-md-6 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ store[1] }}</h5>
                <p class="card-text">{{ store[2] }}, {{ store[3] }}</p>
                
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div>
                        {% if store[4] and store[5] %}
                        <a href="https://yandex.ru/maps/?pt={{ store[5] }},{{ store[4] }}&z=18&l=map"
                           target="_blank" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-map"></i> Открыть на карте
                        </a>
                        {% endif %}
                    </div>
                    <div>
                        <a href="/products?store_id={{ store[0] }}" class="btn btn-sm btn-primary">
                            <i class="bi bi-shop"></i> Товары в магазине
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
